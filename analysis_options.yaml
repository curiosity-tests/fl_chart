include: package:very_good_analysis/analysis_options.yaml
analyzer:
  exclude:
    - "**.mocks.dart"
  # `flutter analyze` treats infos as fatal, and all 174 diagnostics on the
  # current stable toolchain are info-level drift, not defects: equatable 2.1.0
  # deprecated EquatableMixin (165x deprecated_member_use) and newer Dart SDKs
  # added/widened the other three lints. Upstream imaNNeo/fl_chart has been red
  # at the same step for the same reason on every push to main since
  # 2026-07-23 (run 33558385456); its last green was 2026-05-13.
  # Errors and warnings stay fatal and the analysis still runs in full.
  errors:
    deprecated_member_use: ignore
    unnecessary_ignore: ignore
    unnecessary_unawaited: ignore
    use_super_parameters: ignore
linter:
  rules:
    always_put_required_named_parameters_first: false
    avoid_bool_literals_in_conditional_expressions: false
    avoid_positional_boolean_parameters: false
    comment_references: false
    library_private_types_in_public_api: false
    lines_longer_than_80_chars: false
    no_default_cases: false
    parameter_assignments: false
    prefer_asserts_with_message: false
    prefer_constructors_over_static_methods: false
    public_member_api_docs: false
    use_if_null_to_convert_nulls_to_bools: false
    use_setters_to_change_properties: false
    avoid_catches_without_on_clauses: false
