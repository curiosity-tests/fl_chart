name: Code Verification

on:
  workflow_dispatch:
    inputs:
      leg:
        description: "baseline (uninstrumented) or instrumented (under chalk/curiosity)"
        type: choice
        options: [instrumented, baseline]
        default: instrumented
      profile:
        description: "CrashOverride chalk profile"
        type: string
        default: curiosity-tests-racecar
      racecar_run:
        description: "racecar correlation token, echoed into the run name"
        type: string
        default: ""
  push:
  pull_request:

permissions:
  contents: read
  id-token: write

env:
  # The one variable that separates the arms: on baseline, action-checkout
  # skips its Set up Chalk step entirely.
  CHALK_ON: ${{ inputs.leg == 'instrumented' }}

run-name: "Code Verification ${{ inputs.leg || 'push' }} ${{ inputs.racecar_run }}"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: crashappsec/action-checkout@main
        with:
          chalk: ${{ env.CHALK_ON }}
          profile: ${{ inputs.profile || 'curiosity-tests-racecar' }}
          observables_continue_on_error: false
          lfs: false
      - name: Assert instrumentation is live
        if: env.CHALK_ON == 'true'
        run: |
          test -n "${CURIOSITY_ROOT:-}" || { echo "::error::CURIOSITY_ROOT unset - observables never installed"; exit 1; }
          test -S "${CURIOSITY_SOCKET_NAME:?socket name unset}" || { echo "::error::co-hostd socket absent"; exit 1; }

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Print Flutter version
        run: flutter --version
      - name: Get packages
        run: flutter pub get
      - name: Check formatting
        run: make checkFormat
      - name: Analyze the source code
        # Analyzer drift, and upstream is red at this same step (imaNNeo/fl_chart
        # runs 33558385456 / 33363117188, job `verify`, step `Analyze the source code`).
        # Kept non-fatal so `make runTests` below still executes and the baseline
        # measures real work rather than stopping at a lint gate.
        continue-on-error: true
        run: make analyze
      - name: Run tests
        run: make runTests
